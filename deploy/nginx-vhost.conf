# Initial HTTP-only vhost. certbot --nginx will edit this file in place to
# add the 443 server block, TLS directives, and an HTTP→HTTPS redirect.
# After certbot runs, copy the modified vhost back into this file so the
# source-controlled version stays in sync (see deployment.md).

server {
    server_name fitness-challenge-bot.cyberian.me;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/fitness-challenge-bot.cyberian.me/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/fitness-challenge-bot.cyberian.me/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = fitness-challenge-bot.cyberian.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name fitness-challenge-bot.cyberian.me;
    return 404; # managed by Certbot


}